<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doce Mania · Cardápio</title>
<meta name="description" content="Trufas, cones e brigadeiros feitos em casa. Delivery em Arcos/MG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script>
// ============ O QUE A NICOLI MUDA ============
// Número do WhatsApp da loja, só números, com 55 e DDD. Trocar pelo chip novo.
const WHATSAPP = '5537999940405';

// Cardápio. preco em reais (ex.: 3.5). preco: null aparece como "a definir".
// Para tirar um item, apague a linha. Para esgotar, ponha esgotado: true.
const CARDAPIO = [
  { secao: 'Trufas', desenho: 'trufa', itens: [
    { nome: 'Trufa', desc: 'sabor a definir', preco: null },
  ]},
  { secao: 'Cones', desenho: 'cone', itens: [
    { nome: 'Cone trufado', desc: 'sabor a definir', preco: null },
  ]},
  { secao: 'Brigadeiros', desenho: 'brigadeiro', itens: [
    { nome: 'Brigadeiro', desc: 'sabor a definir', preco: null },
  ]},
];
// =============================================
</script>
<style>
:root{
  --vinho:#4A1621; --rose:#F0CFCB; --forte:#8E2B3D; --creme:#FBF4F0; --dourado:#C29A5B;
  --texto:#4A1621; --suave:#7a5058; --linha:#e6d3cc; --card:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--creme);color:var(--texto);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{background:var(--vinho);color:var(--creme);text-align:center;padding:36px 16px 30px;border-bottom:3px solid var(--dourado)}
.selo{width:92px;height:92px;margin:0 auto 14px;border-radius:50%;border:1.5px solid var(--dourado);display:grid;place-items:center}
.selo svg{width:72%;height:72%}
header h1{margin:0;font-size:44px;line-height:1}
header h1 i{color:var(--rose)}
header p{margin:10px 0 0;font-size:15px;opacity:.9}
.tag{display:inline-block;margin-top:14px;font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--dourado)}
nav{position:sticky;top:0;z-index:5;background:var(--creme);border-bottom:1px solid var(--linha)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--vinho);font-weight:800;font-size:14px;padding:8px 14px;border:1.5px solid var(--vinho);border-radius:999px}
section{padding:26px 0 4px}
section h2{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:30px}
section h2 .mini{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--dourado);display:grid;place-items:center;background:var(--card)}
section h2 .mini svg{width:76%;height:76%}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:14px;margin-bottom:10px}
.item .info{flex:1;min-width:0}
.item .nome{font-weight:800;font-size:16px}
.item .desc{color:var(--suave);font-size:14px}
.item .preco{margin-top:4px;font-weight:800;color:var(--forte)}
.item .preco.indef{color:var(--suave);font-weight:600;font-style:italic}
.item.esgotado{opacity:.5}
.qtd{display:flex;align-items:center;gap:6px;flex:none}
.qtd button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--vinho);background:var(--card);color:var(--vinho);font-size:20px;font-weight:800;line-height:1;cursor:pointer;font-family:inherit}
.qtd button.mais{background:var(--vinho);color:var(--creme)}
.qtd span{min-width:22px;text-align:center;font-weight:800}
.form{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:16px;margin:26px 0 0}
.form h2{margin:0 0 12px;font-size:26px}
label{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--texto);background:var(--creme);border:1.5px solid var(--linha);border-radius:12px;padding:11px 12px}
input:focus,textarea:focus{outline:none;border-color:var(--forte)}
.opcoes{display:flex;gap:8px}
.opcoes label{flex:1;margin:0;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--linha);border-radius:12px;padding:11px;cursor:pointer;background:var(--creme)}
.opcoes input{width:auto;accent-color:var(--forte)}
.opcoes label:has(input:checked){border-color:var(--forte);background:#fff}
.aviso{font-size:13px;color:var(--suave);margin-top:8px}
footer{text-align:center;color:var(--suave);font-size:13px;padding:30px 16px 140px}
footer a{color:var(--forte);font-weight:800}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--vinho);color:var(--creme);border-top:3px solid var(--dourado);transform:translateY(110%);transition:transform .25s}
.barra.on{transform:none}
.barra .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.barra .resumo{flex:1;font-size:14px}
.barra .resumo b{display:block;font-size:18px}
.barra button{border:0;border-radius:999px;background:var(--rose);color:var(--vinho);font:800 15px Manrope,sans-serif;padding:13px 18px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="selo" id="seloTopo"></div>
  <h1 class="serif">Doce <i>Mania</i></h1>
  <p>Trufas, cones e brigadeiros feitos em casa</p>
  <span class="tag">DELIVERY EM ARCOS · MG</span>
</header>

<nav><div class="wrap" id="abas"></div></nav>

<main class="wrap">
  <div id="cardapio"></div>

  <div class="form" id="pedido">
    <h2 class="serif">Seu pedido</h2>
    <label for="nome">Seu nome</label>
    <input id="nome" autocomplete="name" placeholder="Como te chamamos?">
    <label>Como você quer receber?</label>
    <div class="opcoes">
      <label><input type="radio" name="entrega" value="Entrega" checked> Entrega</label>
      <label><input type="radio" name="entrega" value="Retirada"> Retirada</label>
    </div>
    <div id="campoEndereco">
      <label for="endereco">Endereço</label>
      <input id="endereco" autocomplete="street-address" placeholder="Rua, número e bairro">
    </div>
    <label for="obs">Observação</label>
    <textarea id="obs" rows="2" placeholder="Horário, sabor preferido, algum recado..."></textarea>
    <p class="aviso">O pedido chega pronto no nosso WhatsApp. Lá a gente confirma o valor da entrega e o pagamento.</p>
  </div>
</main>

<footer>
  <div class="serif" style="font-size:22px;color:var(--vinho)">Doce Mania</div>
  <a href="https://www.instagram.com/docemania.arcos/">@docemania.arcos</a>
</footer>

<div class="barra" id="barra">
  <div class="wrap">
    <div class="resumo"><span id="qtdTotal">0 itens</span><b id="valorTotal">R$ 0,00</b></div>
    <button id="enviar">Pedir no WhatsApp</button>
  </div>
</div>

<script>
// Desenhos da identidade (clássica 02 vinho), em 0..100
function desenho(tipo, l, c, m, sw = 2.6) {
  const s = `stroke="${l}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
  let d;
  if (tipo === 'cone') {
    d = `<path d="M31 50 L69 50 L50 93 Z" fill="${m}" ${s}/>`
      + `<line x1="38" y1="58" x2="58" y2="76" ${s}/><line x1="46" y1="52" x2="64" y2="62" ${s}/>`
      + `<line x1="62" y1="58" x2="42" y2="76" ${s}/><line x1="54" y1="52" x2="36" y2="62" ${s}/>`
      + `<path d="M28 52 C24 36 36 24 50 24 C64 24 76 36 72 52 C68 56 64 50 60 55 C56 60 52 52 48 56 C44 60 40 52 36 56 C32 58 30 56 28 52 Z" fill="${c}" ${s}/>`
      + `<path d="M50 20 Q52 10 60 6" fill="none" ${s}/><circle cx="50" cy="20" r="6" fill="#8E2B3D" ${s}/>`;
  } else if (tipo === 'brigadeiro') {
    const gr = [[38,34,30],[50,28,-20],[56,40,60],[42,46,-40],[60,32,10],[47,39,80],[33,43,-10],[52,49,20],[62,44,-50],[44,26,70]]
      .map(([x,y,r]) => `<rect x="${x}" y="${y}" width="6" height="2.4" rx="1.2" fill="${m}" transform="rotate(${r} ${x+3} ${y+1.2})"/>`).join('');
    const pl = [34,42,50,58,66].map(x => `<line x1="${x}" y1="60" x2="${50+(x-50)*0.78}" y2="86" ${s}/>`).join('');
    d = `<path d="M20 60 L80 60 L72 86 L28 86 Z" fill="${m}" ${s}/>${pl}<circle cx="50" cy="42" r="22" fill="${c}" ${s}/>${gr}`;
  } else {
    d = `<path d="M30 50 L8 34 L13 50 L8 66 Z" fill="${m}" ${s}/><path d="M70 50 L92 34 L87 50 L92 66 Z" fill="${m}" ${s}/>`
      + `<line x1="13" y1="42" x2="26" y2="48" ${s}/><line x1="13" y1="58" x2="26" y2="52" ${s}/>`
      + `<line x1="87" y1="42" x2="74" y2="48" ${s}/><line x1="87" y1="58" x2="74" y2="52" ${s}/>`
      + `<ellipse cx="50" cy="50" rx="22" ry="19" fill="${c}" ${s}/>`
      + `<path d="M36 46 Q43 40 50 46 T64 46" fill="none" ${s}/>`;
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${d}</svg>`;
}

const real = v => 'R$ ' + v.toFixed(2).replace('.', ',');
const slug = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\W+/g, '-');
const qtd = {};

document.getElementById('seloTopo').innerHTML = desenho('trufa', '#FBF4F0', '#8E2B3D', '#F0CFCB');
document.getElementById('abas').innerHTML = CARDAPIO.map(s => `<a href="#${slug(s.secao)}">${s.secao}</a>`).join('');
document.getElementById('cardapio').innerHTML = CARDAPIO.map((s, i) => `
  <section id="${slug(s.secao)}">
    <h2 class="serif"><span class="mini">${desenho(s.desenho, '#4A1621', '#4A1621', '#F0CFCB')}</span>${s.secao}</h2>
    ${s.itens.map((it, j) => {
      const id = i + '-' + j;
      const preco = it.preco == null ? '<div class="preco indef">preço a definir</div>' : `<div class="preco">${real(it.preco)}</div>`;
      const ctrl = it.esgotado ? '<div class="preco indef">esgotado</div>'
        : `<div class="qtd"><button aria-label="Tirar um" data-id="${id}" data-d="-1">−</button><span id="q${id}">0</span><button class="mais" aria-label="Pôr mais um" data-id="${id}" data-d="1">+</button></div>`;
      return `<div class="item${it.esgotado ? ' esgotado' : ''}"><div class="info"><div class="nome">${it.nome}</div>${it.desc ? `<div class="desc">${it.desc}</div>` : ''}${preco}</div>${ctrl}</div>`;
    }).join('')}
  </section>`).join('');

function item(id) { const [i, j] = id.split('-').map(Number); return CARDAPIO[i].itens[j]; }

function atualizar() {
  let n = 0, total = 0, semPreco = false;
  for (const [id, q] of Object.entries(qtd)) {
    if (!q) continue;
    n += q;
    const p = item(id).preco;
    if (p == null) semPreco = true; else total += p * q;
  }
  document.getElementById('qtdTotal').textContent = n + (n === 1 ? ' item' : ' itens');
  document.getElementById('valorTotal').textContent = semPreco ? (total ? real(total) + ' + a combinar' : 'valor a combinar') : real(total);
  document.getElementById('barra').classList.toggle('on', n > 0);
}

document.getElementById('cardapio').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  const id = b.dataset.id;
  qtd[id] = Math.max(0, (qtd[id] || 0) + Number(b.dataset.d));
  document.getElementById('q' + id).textContent = qtd[id];
  atualizar();
});

document.querySelectorAll('input[name=entrega]').forEach(r => r.addEventListener('change', () => {
  document.getElementById('campoEndereco').style.display =
    document.querySelector('input[name=entrega]:checked').value === 'Entrega' ? '' : 'none';
}));

document.getElementById('enviar').addEventListener('click', () => {
  const nome = document.getElementById('nome').value.trim();
  const entrega = document.querySelector('input[name=entrega]:checked').value;
  const endereco = document.getElementById('endereco').value.trim();
  if (!nome || (entrega === 'Entrega' && !endereco)) {
    document.getElementById('pedido').scrollIntoView({ behavior: 'smooth' });
    (nome ? document.getElementById('endereco') : document.getElementById('nome')).focus();
    return;
  }
  const linhas = ['Oi! Quero fazer um pedido na Doce Mania:', ''];
  let total = 0, semPreco = false;
  for (const [id, q] of Object.entries(qtd)) {
    if (!q) continue;
    const it = item(id);
    const nomeItem = it.nome + (it.desc && it.desc !== 'sabor a definir' ? ' (' + it.desc + ')' : '');
    if (it.preco == null) { semPreco = true; linhas.push(`${q}x ${nomeItem}`); }
    else { total += it.preco * q; linhas.push(`${q}x ${nomeItem} · ${real(it.preco * q)}`); }
  }
  linhas.push('');
  if (total) linhas.push('Total: ' + real(total) + (semPreco ? ' + itens a combinar' : ''));
  linhas.push('Nome: ' + nome);
  linhas.push(entrega === 'Entrega' ? 'Entrega em: ' + endereco : 'Vou retirar');
  const obs = document.getElementById('obs').value.trim();
  if (obs) linhas.push('Obs.: ' + obs);
  window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(linhas.join('\n')), '_blank');
});
</script>
</body>
</html>
